### DATABASE ###
spring.datasource.url=jdbc:mysql://db:3306/foyer?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC

spring.datasource.username=root
spring.datasource.password=
### JPA / HIBERNATE ###
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8081
server.servlet.context-path=/Foyer
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
####sdfA
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=*



management.server.port=8081


### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Actuator Configuration
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.endpoints.enabled-by-default=true
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# CORS Configuration
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,DELETE,PUT

# Prometheus Configuration
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.sla.http.server.requests=1ms,5ms,10ms,50ms,100ms,200ms,500ms,1s,5s
management.metrics.tags.application=${spring.application.name}

# Application info
spring.application.name=Foyer
management.info.env.enabled=true
info.app.name=Foyer Application
info.app.description=Spring Boot application with Prometheus monitoring
info.app.version=5.0.0