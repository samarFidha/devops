services:
  db:
    container_name: mysql
    image: --platform=linux/amd64 mysql:8.0
    cap_add:
      - SYS_NICE
    restart: always
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_DATABASE=foyer
    ports:
      - '3306:3306'
    volumes:
      - mysql:/var/lib/mysql
      - $PWD/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  spring_app:
    container_name: foyer-app
    image: foyer-app:latest
    restart: on-failure
    build: .
    ports:
      - 8081:8081
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  mysql:
    driver: local

networks:
  app-network:
    driver: bridge
