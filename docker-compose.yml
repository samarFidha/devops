
services:
  spring_app:
    container_name: dev
    image: amenallahbelhouichet/dev:latest
    restart: on-failure
    build: .
    ports:
      - "8085:8081"
    command: ["java", "-jar", "app.jar"]
    expose:
      - "8081"

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9092:9090"
    volumes:
      - /mnt/c/Users/amena/OneDrive/Bureau/Devops/devops/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - spring_app

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
