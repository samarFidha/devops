version: '3.8'

services:
  data:
    image: mysql:8.0
    container_name: data
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"  # Allow empty root password
      MYSQL_DATABASE: foyer               # Database to create
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3309:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot" ]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - foyer-net

  pro-foyer:
      image: bechirgarali/foyer-app:latest
      depends_on:
        data:
          condition: service_healthy
      ports:
        - "8089:8081"
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://data:3306/foyer
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: ""  # Empty password
      networks:
        - foyer-net

  prometheus:
    image: prom/prometheus
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - pro-foyer
    networks:
      - foyer-net

  grafana:
    image: grafana/grafana
    ports:
      - "3009:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DATASOURCES_DEFAULT_TYPE=prometheus
      - GF_DATASOURCES_DEFAULT_URL=http://prometheus:9090  # Changed from localhost
      - GF_DATASOURCES_DEFAULT_ACCESS=proxy
      - GF_DATASOURCES_DEFAULT_IS_DEFAULT=true
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - foyer-net

volumes:
  mysql_data:
  grafana-data:

networks:
  foyer-net:
    driver: bridge